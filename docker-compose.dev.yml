services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: website-agent-dev

    working_dir: /app

    volumes:
      - .:/app
      - /app/.venv

    env_file:
      - .env

    command: sleep infinity

    stdin_open: true
    tty: true

  postgres:
    image: postgres:16
    container_name: website-agent-postgres

    environment:
      POSTGRES_DB: website_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5433:5432"

volumes:
  postgres_data: